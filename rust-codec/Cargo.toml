[package]
name = "cutetts_codec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "cutetts-decode"
path = "src/bin/decode_bench.rs"

[dev-dependencies]
# test-only oracle (simd bf16 cross-check); never linked into the binary
half = "2"

[dependencies]
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
sentencepiece = "0.14.0"
hound = "3.5.1"
