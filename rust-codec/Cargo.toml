[package]
name = "cutetts_codec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "cutetts-decode"
path = "src/bin/decode_bench.rs"

[dependencies]
half = "2"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
sentencepiece = "0.14.0"
